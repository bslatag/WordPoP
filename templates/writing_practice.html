<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>默写练习</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root {
  --bg-color: #B9C7F8;
  --text-color: #0D2A5A;
  --accent-pink: #FF6B9D;
  --accent-cyan: #00D2BE;
  --border-color: #2D3436;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'ZCOOL KuaiLe', cursive;
  background: var(--bg-color);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}
.container {
  width: 100%;
  max-width: 600px;
  padding: 20px;
  position: relative;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.progress {
  position: absolute;
  top: 20px; left: 20px;
  font-size: 20px;
  background: rgba(255,255,255,0.5);
  padding: 4px 12px;
  border-radius: 10px;
}
.back-btn {
  position: absolute;
  top: 20px; right: 20px;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--accent-pink);
  color: #fff;
  border: 3px solid var(--border-color);
  font-size: 22px;
  cursor: pointer;
}
.input-area {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  gap: 12px;
  margin-bottom: 16px;
}
.input-box {
  flex: 1;
  padding: 20px;
  font-size: 28px;
  font-family: 'Fredoka One', cursive;
  text-align: center;
  border: 4px solid var(--border-color);
  border-radius: 16px;
  outline: none;
  max-width: 400px;
}
.speak-btn {
  background: transparent;
  border: none;
  font-size: 42px;
  font-weight: bold;
  color: #0D21A5;
  text-shadow: 0 0 4px #fff;
  cursor: pointer;
  font-family: 'ZCOOL KuaiLe', cursive;
  line-height: 1;
}
.info {
  font-size: 24px;
  text-align: center;
  min-height: 36px;
  margin-bottom: 16px;
  color: var(--text-color);
  transition: color 0.2s;
}
.confirm-btn {
  background: transparent;
  border: none;
  font-size: 50px;
  color: var(--accent-cyan);
  cursor: pointer;
}
</style>
</head>
<body>
<div class="container">
  <div class="progress" id="progress">0/0</div>
  <button class="back-btn" onclick="history.back()">✕</button>

  <div class="input-area">
    <button class="speak-btn" id="speakBtn">咋读咧</button>
    <input type="text" class="input-box" id="inputBox" placeholder="输入单词">
  </div>

  <div class="info" id="info"></div>

  <button class="confirm-btn" id="confirmBtn">✔</button>
</div>

<script>
const allWords = JSON.parse(localStorage.getItem('all_words_json') || '[]');
const wordMap = allWords.reduce((m, w) => {
  m[w.单词] = w.释义;
  return m;
}, {});

const source = localStorage.getItem('current_practice');
const wordList = JSON.parse(localStorage.getItem(`wordpop_${source}`) || []);
const requiredCorrect = parseInt(localStorage.getItem('practice_required_correct'), 10) || 3;

const wordProgress = {};
let current = null;
let answerShown = false;
let infoTimer = null;

const infoEl = document.getElementById('info');
const inputBox = document.getElementById('inputBox');

function showInfo(text, color) {
  if (infoTimer) clearTimeout(infoTimer);
  infoEl.innerText = text;
  infoEl.style.color = color;
}

function showMeaning() {
  if (!current) return;
  const meaningText = wordMap[current] || '暂无释义';
  infoEl.innerText = meaningText;
  infoEl.style.color = '#0D2A5A';
}

function flashInfo(text, color, duration = 1500) {
  showInfo(text, color);
  infoTimer = setTimeout(() => {
    showMeaning();
    infoTimer = null;
  }, duration);
}

function getNextWord() {
  const available = wordList.filter(w => {
    const p = wordProgress[w] || { correct: 0 };
    return p.correct < requiredCorrect;
  });
  if (available.length === 0) return null;
  return available[Math.floor(Math.random() * available.length)];
}

function randWord() {
  const next = getNextWord();
  if (!next) {
    infoEl.innerText = "🎉 全部完成！";
    inputBox.disabled = true;
    document.getElementById('progress').innerText = `共 ${wordList.length} 词`;
    return;
  }

  current = next;
  answerShown = false;
  if (!wordProgress[current]) {
    wordProgress[current] = { correct: 0, wrong: 0 };
  }

  showMeaning();
  inputBox.value = '';
  inputBox.disabled = false;
  document.getElementById('progress').innerText = `共 ${wordList.length} 词`;
}

function check() {
  if (!current) return;

  const val = inputBox.value.trim().toLowerCase();
  const ans = current.toLowerCase();
  const prog = wordProgress[current];

  if (answerShown) {
    if (val === ans) {
      prog.correct = 0;
      prog.wrong = 0;
      answerShown = false;
      flashInfo('已重置，继续前进', '#00D2BE', 800);
      inputBox.value = '';
      setTimeout(randWord, 800);
    } else {
      flashInfo('请正确输入上方单词', '#ff4444', 1200);
      inputBox.value = '';
    }
    return;
  }

  if (val === ans) {
    prog.correct++;
    flashInfo(`正确 ${prog.correct}/${requiredCorrect}`, '#00D2BE', 1000);
  } else {
    prog.wrong++;
    if (prog.wrong >= 3) {
      showInfo(`正确单词：${current}`, '#ff4444');
      answerShown = true;
    } else {
      flashInfo('错误', '#ff4444', 1000);
    }
  }

  inputBox.value = '';

  if (val === ans && !answerShown) {
    setTimeout(randWord, 1000);
  }
}

document.getElementById('confirmBtn').onclick = check;
inputBox.addEventListener('keydown', e => {
  if (e.key === 'Enter') check();
});

document.getElementById('speakBtn').onclick = () => {
  if (!current) return;
  const u = new SpeechSynthesisUtterance(current);
  u.lang = 'en-US';
  speechSynthesis.speak(u);
};

if (wordList.length === 0) {
  infoEl.innerText = "暂无单词";
  inputBox.disabled = true;
} else {
  randWord();
}
</script>
</body>
</html>
