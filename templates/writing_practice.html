<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>默写练习</title>
<link href="https://fonts.loli.net/css2?family=Fredoka+One&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root {
  --bg-color: #B9C7F8;
  --text-color: #0D2A5A;
  --accent-pink: #FF6B9D;
  --accent-cyan: #00D2BE;
  --border-color: #2D3436;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'ZCOOL KuaiLe', cursive;
  background: var(--bg-color);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}
.container {
  width: 100%;
  max-width: 600px;
  padding: 20px;
  position: relative;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
}
.progress {
  position: absolute;
  top: 50px; left: -30px;
  font-family: 'Microsoft YaHei', sans-serif;
  font-size: 22px;
  color:#0D21A5;
  background: none;
  padding: 0;
}
.back-btn {
  position: absolute;
  top: 50px; right: -30px;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--accent-pink);
  color: #fff;
  border: 3px solid var(--border-color);
  font-size: 22px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 3px 3px 0 var(--border-color);
  transition: transform 0.1s;
  font-family: 'ZCOOL KuaiLe', cursive;
}
.back-btn:active {
  transform: translate(2px, 2px);
  box-shadow: 1px 1px 0 var(--border-color);
}
.input-box {
  width: 100%;
  max-width: 550px;
  padding: 20px;
  font-size: 30px;
  font-family: 'Fredoka One', cursive;
  text-align: center;
  border: none;
  outline: none;
  background: transparent;
  color: #000;
}
.input-box::placeholder {
  color: rgba(0, 0, 0, 0.4);
  font-family: 'Fredoka One', cursive;
}
.info {
  font-family: 'Microsoft YaHei', sans-serif;
  font-size: 30px;
  text-align: center;
  color: var(--text-color);
  min-height: 36px;
  transition: color 0.2s;
}
.speak-btn {
  background: none;
  border: none;
  font-size: 42px;
  font-weight: bold;
  color: #D1D067;
  text-shadow:
    -2px -2px 0 #fff,
     2px -2px 0 #fff,
    -2px  2px 0 #fff,
     2px 2px 0 #fff,
     4px 4px 0 #0D21A5;
  cursor: pointer;
  font-family: 'ZCOOL KuaiLe', cursive;
  line-height: 1;
  padding: 5px 20px;
  border-radius: 10px;
  transition: transform 0.1s;
}
.speak-btn:active {
  transform: translate(2px, 2px);
  box-shadow: none;
}
.confirm-btn {
  position: absolute;
  bottom: 80px; right: -30px;
  background: transparent;
  border: none;
  font-size: 50px;
  color: var(--accent-cyan);
  cursor: pointer;
  font-family: 'ZCOOL KuaiLe', cursive;
}
</style>
</head>
<body>
<div class="container">
  <div class="progress" id="progress">剩余：0</div>
  <button class="back-btn" onclick="history.back()">✕</button>

  <input type="text" class="input-box" id="inputBox" placeholder="输入单词">

  <div class="info" id="info"></div>

  <button class="speak-btn" id="speakBtn">咋读咧</button>

  <button class="confirm-btn" id="confirmBtn">✔</button>
</div>

<script>
let wordItems = [], requiredCorrect = 3, order = 'random', wordProgress = {}, current = null, answerShown = false, infoTimer = null, remainingCount = 0;
const infoEl = document.getElementById('info'), inputBox = document.getElementById('inputBox');

// --- 语音引擎预热（修复延迟） ---
let speechReady = false;
function warmUpSpeech() {
  if (speechReady) return;
  const u = new SpeechSynthesisUtterance('');
  u.volume = 0;
  window.speechSynthesis.speak(u);
  speechReady = true;
}
document.getElementById('speakBtn').addEventListener('mousedown', warmUpSpeech);
document.getElementById('speakBtn').addEventListener('touchstart', warmUpSpeech);

(async function init() {
  const source = localStorage.getItem('current_practice') || 'selfstudy';
  requiredCorrect = parseInt(localStorage.getItem('practice_required_correct'),10)||3;
  order = localStorage.getItem('practice_order')||'random';
  try {
    const res = await fetch(`/api/word-list/${source}`);
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    if (!Array.isArray(data) || data.length===0) {
      infoEl.innerText='暂无单词'; inputBox.disabled=true; return;
    }
    wordItems = data.map(d => ({ word: d.word, meaning: d.meaning || '暂无释义' }));
    if (order==='sequential') wordItems.sort((a,b)=>a.word.localeCompare(b.word));
    wordProgress = {}; remainingCount = wordItems.length;
    updateProgress(); randWord();
  } catch(e) {
    infoEl.innerText='加载出错'; inputBox.disabled=true;
  }
})();

function updateProgress() { document.getElementById('progress').innerText = `剩余：${remainingCount}`; }

function showInfo(text, color) {
  if(infoTimer)clearTimeout(infoTimer);
  infoEl.innerText=text; infoEl.style.color=color;
}
function showMeaning() {
  if(!current)return;
  const item=wordItems.find(w=>w.word===current);
  infoEl.innerText=(item?item.meaning:'暂无释义');
  infoEl.style.color='#0D21A5';
}
function flashInfo(text,color,duration=1500){
  showInfo(text,color);
  infoTimer=setTimeout(()=>{showMeaning();infoTimer=null;},duration);
}

function getNextWord() {
  const avail = wordItems.filter(w => (wordProgress[w.word]?.correct||0) < requiredCorrect);
  if (!avail.length) return null;
  return order==='sequential' ? avail[0].word : avail[Math.floor(Math.random()*avail.length)].word;
}

function randWord() {
  const next = getNextWord();
  if (!next) { infoEl.innerText='🎉 全部完成！'; inputBox.disabled=true; return; }
  current = next;
  answerShown = false;
  if (!wordProgress[current]) wordProgress[current] = { correct:0, wrong:0, done:false };
  showMeaning();
  inputBox.value=''; inputBox.disabled=false;
}

function check() {
  if (!current) return;
  const val = inputBox.value.trim().toLowerCase(), ans = current.toLowerCase(), prog = wordProgress[current];
  if (answerShown) {
    if (val === ans) {
      prog.correct=0; prog.wrong=0; answerShown=false;
      flashInfo('已重置，继续前进','#00D2BE',800); inputBox.value=''; setTimeout(randWord,800);
    } else { flashInfo('请正确输入上方单词','#ff4444',1200); inputBox.value=''; }
    return;
  }
  if (val === ans) {
    prog.correct++;
    flashInfo(`正确 ${prog.correct}/${requiredCorrect}`,'#00D2BE',1000);
  } else {
    prog.wrong++;
    if (prog.wrong >= 3) { showInfo(`正确单词：${current}`,'#ff4444'); answerShown=true; inputBox.value=''; return; }
    else { flashInfo('错误','#ff4444',1000); }
  }
  if (prog.correct >= requiredCorrect && !prog.done) {
    prog.done = true;
    remainingCount--;
    updateProgress();
  }
  inputBox.value='';
  if (val===ans && !answerShown) setTimeout(randWord,1000);
}

document.getElementById('confirmBtn').onclick=check;
inputBox.addEventListener('keydown',e=>{ if(e.key==='Enter') check(); });

document.getElementById('speakBtn').onclick = () => {
  if (!current) return;
  warmUpSpeech();
  const u = new SpeechSynthesisUtterance(current);
  u.lang = 'en-US';
  window.speechSynthesis.speak(u);
};
</script>
</body>
</html>
