<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>默写练习</title>
<link href="https://fonts.loli.net/css2?family=Fredoka+One&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root {
  --bg-color: #B9C7F8;
  --text-color: #0D2A5A;
  --accent-pink: #FF6B9D;
  --accent-cyan: #00D2BE;
  --border-color: #2D3436;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'ZCOOL KuaiLe', cursive;
  background: var(--bg-color);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}
.container {
  width: 100%;
  max-width: 600px;
  padding: 20px;
  position: relative;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
/* 左上角进度 */
.progress {
  position: absolute;
  top: 20px; left: 20px;
  font-size: 20px;
  background: rgba(255,255,255,0.5);
  padding: 4px 12px;
  border-radius: 10px;
}
/* 退出按钮 - 右上角 */
.back-btn {
  position: absolute;
  top: 20px; right: 20px;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--accent-pink);
  color: #fff;
  border: 3px solid var(--border-color);
  font-size: 22px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
/* 输入行：喇叭 + 输入框 */
.input-area {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  gap: 12px;
  margin-bottom: 16px;
}
.input-box {
  flex: 1;
  padding: 20px;
  font-size: 28px;
  font-family: 'Fredoka One', cursive;
  text-align: center;
  border: 4px solid var(--border-color);
  border-radius: 16px;
  outline: none;
  max-width: 400px;
}
.speak-btn {
  background: transparent;
  border: none;
  font-size: 42px;
  font-weight: bold;
  color: #0D21A5;
  text-shadow: 0 0 4px #fff;
  cursor: pointer;
  font-family: 'ZCOOL KuaiLe', cursive;
  line-height: 1;
}
/* 信息区：释义/正误提示，位于输入框右下角，左对齐 */
.info {
  width: 100%;
  max-width: 400px;
  text-align: left;
  font-size: 24px;
  min-height: 36px;
  margin-bottom: 16px;
  color: var(--text-color);
  padding-left: 42px; /* 给左侧喇叭留空，保持与输入框对齐 */
  transition: color 0.2s;
}
/* 确认按钮 - 右下角，与退出按钮同一竖直线 */
.confirm-btn {
  position: absolute;
  bottom: 30px; right: 30px;
  background: transparent;
  border: none;
  font-size: 50px;
  color: var(--accent-cyan);
  cursor: pointer;
}
</style>
</head>
<body>
<div class="container">
  <div class="progress" id="progress">0/0</div>
  <button class="back-btn" onclick="history.back()">✕</button>

  <div class="input-area">
    <button class="speak-btn" id="speakBtn">咋读咧</button>
    <input type="text" class="input-box" id="inputBox" placeholder="输入单词">
  </div>

  <div class="info" id="info"></div>

  <button class="confirm-btn" id="confirmBtn">✔</button>
</div>

<script>
// 从后端获取释义映射，不依赖localStorage
const allWordsPromise = fetch('/api/study-words?all=1')  // 后端需要支持返回全部词库，如添加参数或新增接口
  .catch(() => fetch('/api/word-list/learned'))  // 兜底方案，确保不会崩溃
  .then(res => res.ok ? res.json() : []);

const source = localStorage.getItem('current_practice');
const wordList = JSON.parse(localStorage.getItem(`wordpop_${source}`) || '[]');
const requiredCorrect = parseInt(localStorage.getItem('practice_required_correct'), 10) || 3;
const order = localStorage.getItem('practice_order') || 'random';

let orderedList = wordList;
if (order === 'sequential') {
  orderedList = [...wordList].sort();
}

const wordProgress = {};
let current = null;
let answerShown = false;
let infoTimer = null;
let wordMap = {};

const infoEl = document.getElementById('info');
const inputBox = document.getElementById('inputBox');

// 初始化释义映射
allWordsPromise.then(words => {
  if (Array.isArray(words)) {
    words.forEach(w => { wordMap[w.单词] = w.释义 || '暂无释义'; });
  }
  if (wordList.length === 0) {
    infoEl.innerText = "暂无单词";
    inputBox.disabled = true;
  } else {
    randWord();
  }
});

function showInfo(text, color) {
  if (infoTimer) clearTimeout(infoTimer);
  infoEl.innerText = text;
  infoEl.style.color = color;
}

function showMeaning() {
  if (!current) return;
  const meaning = wordMap[current] || '暂无释义';
  infoEl.innerText = meaning;
  infoEl.style.color = '#0D2A5A';
}

function flashInfo(text, color, duration = 1500) {
  showInfo(text, color);
  infoTimer = setTimeout(() => {
    showMeaning();
    infoTimer = null;
  }, duration);
}

function getNextWord() {
  const available = orderedList.filter(w => {
    const p = wordProgress[w] || { correct: 0 };
    return p.correct < requiredCorrect;
  });
  if (available.length === 0) return null;
  if (order === 'sequential') return available[0];
  return available[Math.floor(Math.random() * available.length)];
}

function randWord() {
  const next = getNextWord();
  if (!next) {
    infoEl.innerText = "🎉 全部完成！";
    inputBox.disabled = true;
    document.getElementById('progress').innerText = `共 ${wordList.length} 词`;
    return;
  }
  current = next;
  answerShown = false;
  if (!wordProgress[current]) wordProgress[current] = { correct: 0, wrong: 0 };
  showMeaning();
  inputBox.value = '';
  inputBox.disabled = false;
  document.getElementById('progress').innerText = `共 ${wordList.length} 词`;
}

function check() {
  if (!current) return;

  const val = inputBox.value.trim().toLowerCase();
  const ans = current.toLowerCase();
  const prog = wordProgress[current];

  if (answerShown) {
    if (val === ans) {
      prog.correct = 0;
      prog.wrong = 0;
      answerShown = false;
      flashInfo('已重置，继续前进', '#00D2BE', 800);
      inputBox.value = '';
      setTimeout(randWord, 800);
    } else {
      flashInfo('请正确输入上方单词', '#ff4444', 1200);
      inputBox.value = '';
    }
    return;
  }

  if (val === ans) {
    prog.correct++;
    flashInfo(`正确 ${prog.correct}/${requiredCorrect}`, '#00D2BE', 1000);
  } else {
    prog.wrong++;
    if (prog.wrong >= 3) {
      showInfo(`正确单词：${current}`, '#ff4444');
      answerShown = true;
    } else {
      flashInfo('错误', '#ff4444', 1000);
    }
  }

  inputBox.value = '';

  if (val === ans && !answerShown) {
    setTimeout(randWord, 1000);
  }
}

document.getElementById('confirmBtn').onclick = check;
inputBox.addEventListener('keydown', e => {
  if (e.key === 'Enter') check();
});

document.getElementById('speakBtn').onclick = () => {
  if (!current) return;
  const u = new SpeechSynthesisUtterance(current);
  u.lang = 'en-US';
  speechSynthesis.speak(u);
};
</script>
</body>
</html>
