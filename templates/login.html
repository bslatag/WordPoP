<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户中心 - WordPoP</title>
<link href="https://fonts.loli.net/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root {
  --bg-color: #B9C7F8;
  --card-color: #D1D067;
  --text-color: #0D21A5;
  --accent-pink: #FF6B9D;
  --accent-cyan: #00D2BE;
  --border-color: #2D3436;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'ZCOOL KuaiLe', cursive;
  background: var(--bg-color);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}
.container {
  width: 100%;
  max-width: 460px;
  padding: 20px;
}
.card {
  background: var(--card-color);
  border: 4px solid var(--border-color);
  border-radius: 30px;
  padding: 40px 30px;
  box-shadow: 8px 8px 0 var(--border-color);
  text-align: center;
}
.card h1 {
  color: var(--text-color);
  font-size: 42px;
  margin-bottom: 30px;
}
.info-block {
  display: flex;
  flex-direction: column;
  gap: 20px;
  align-items: center;
}
.stat-row {
  display: flex;
  gap: 30px;
  justify-content: center;
}
.stat-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  font-size: 24px;
  color: var(--text-color);
}
.stat-item .num {
  font-size: 40px;
  font-weight: bold;
}
.btn {
  background: var(--accent-pink);
  color: white;
  border: 3px solid var(--border-color);
  padding: 12px 30px;
  border-radius: 15px;
  font-size: 22px;
  cursor: pointer;
  font-family: 'ZCOOL KuaiLe', cursive;
  box-shadow: 4px 4px 0 var(--border-color);
  transition: all 0.1s;
}
.btn:active {
  transform: translate(2px,2px);
  box-shadow: 1px 1px 0 var(--border-color);
}
.form-input {
  width: 100%;
  padding: 12px;
  font-size: 20px;
  border: 3px solid var(--border-color);
  border-radius: 12px;
  text-align: center;
  font-family: 'ZCOOL KuaiLe', cursive;
  margin-bottom: 20px;
  outline: none;
}
.login-btn {
  background: var(--text-color);
  color: #fff;
  border: 3px solid var(--border-color);
  padding: 12px 40px;
  font-size: 22px;
  border-radius: 12px;
  cursor: pointer;
  font-family: 'ZCOOL KuaiLe', cursive;
  box-shadow: 4px 4px 0 var(--border-color);
  transition: all 0.1s;
}
.login-btn:active {
  transform: translate(2px,2px);
  box-shadow: 2px 2px 0 var(--border-color);
}
.hidden {
  display: none;
}
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>WordPoP</h1>

    <!-- 已登录用户信息面板 -->
    <div id="userPanel" class="hidden">
      <div class="info-block">
        <div style="font-size:28px; color:var(--text-color);" id="greeting"></div>
        <div class="stat-row">
          <div class="stat-item">
            <span class="num" id="studyDays">0</span>
            <span>已学天数</span>
          </div>
          <div class="stat-item">
            <span class="num" id="pendingWords">0</span>
            <span>待默写</span>
          </div>
        </div>
        <button class="btn" id="logoutBtnPage">退出登录</button>
      </div>
    </div>

    <!-- 未登录/游客登录表单 -->
    <div id="loginPanel" class="hidden">
      <form id="loginForm" method="post">
        <input type="text" name="username" placeholder="输入学号 / 用户名" class="form-input" required>
        <button type="submit" class="login-btn">登录/注册</button>
      </form>
      <p style="margin-top:15px;"><a href="/" style="color:var(--text-color);">返回首页</a></p>
    </div>
  </div>
</div>

<script>
// 获取用户状态
fetch('/api/user')
  .then(res => res.json())
  .then(user => {
    if (user.username) {
      // 正式用户，显示信息面板
      document.getElementById('userPanel').classList.remove('hidden');
      document.getElementById('greeting').innerText = '👋 ' + user.username;
      document.getElementById('studyDays').innerText = user.study_days || 1;
      document.getElementById('pendingWords').innerText = user.pending_words || 0;
      document.getElementById('logoutBtnPage').onclick = function() {
        window.location.href = '/logout';
      };
    } else {
      // 游客或未登录，显示登录面板
      document.getElementById('loginPanel').classList.remove('hidden');
    }
  })
  .catch(() => {
    // 网络错误，也显示登录面板
    document.getElementById('loginPanel').classList.remove('hidden');
  });
</script>
</body>
</html>
