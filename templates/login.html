<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 WordPoP</title>
<link href="https://fonts.loli.net/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-color: #B9C7F8;
        --card-color: #D1D067;
        --text-color: #0D21A5;
        --border-color: #2D3436;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'ZCOOL KuaiLe', cursive;
        background-color: var(--bg-color);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    /* --- 漫画集中线背景 (默认隐藏) --- */
    .speed-lines {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: repeating-conic-gradient(
            from 0deg,
            rgba(255,255,255,0.2) 0deg 10deg,
            transparent 10deg 20deg
        );
        opacity: 0;
        pointer-events: none;
        z-index: 99;
    }

    .login-box {
        background: var(--card-color);
        border: 4px solid var(--border-color);
        padding: 50px 40px;
        border-radius: 30px;
        text-align: center;
        width: 90%;
        max-width: 420px;
        box-shadow: 12px 12px 0 var(--border-color); 
        position: relative;
        z-index: 10;
        transition: transform 0.1s;
    }

    /* --- 震动动画 --- */
    .shake-hard {
        animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes shake {
        10%, 90% { transform: translate3d(-2px, 0, 0); }
        20%, 80% { transform: translate3d(4px, 0, 0); }
        30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
        40%, 60% { transform: translate3d(8px, 0, 0); }
    }

    .login-box h1 {
        color: var(--text-color);
        font-size: 42px;
        margin-bottom: 40px;
        letter-spacing: 2px;
    }

    .login-box input {
        width: 100%;
        padding: 15px 10px;
        font-size: 20px;
        background: #fff;
        border: 3px solid var(--border-color);
        border-radius: 15px;
        margin-bottom: 30px;
        text-align: center;
        font-family: 'ZCOOL KuaiLe', cursive;
        color: var(--text-color);
        outline: none;
    }

    .login-box input:focus {
        transform: scale(1.05) rotate(-1deg);
        border-color: var(--text-color);
        box-shadow: 4px 4px 0 rgba(0,0,0,0.1);
    }

    .login-box button {
        background: var(--text-color);
        color: #fff;
        border: 3px solid var(--border-color);
        padding: 15px 50px;
        font-size: 24px;
        border-radius: 15px;
        cursor: pointer;
        font-family: 'ZCOOL KuaiLe', cursive;
        box-shadow: 6px 6px 0 var(--border-color);
        transition: all 0.1s;
        position: relative;
        overflow: hidden;
    }

    .login-box button:active {
        transform: translate(4px, 4px);
        box-shadow: 2px 2px 0 var(--border-color);
    }

    /* --- 漫画气泡 --- */
    .comic-bubble {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0);
        background: #fff;
        border: 4px solid var(--border-color);
        padding: 20px 40px;
        border-radius: 50%;
        z-index: 100;
        text-align: center;
        pointer-events: none;
        box-shadow: 8px 8px 0 rgba(0,0,0,0.2);
    }

    .comic-bubble::after {
        content: '';
        position: absolute;
        bottom: -20px;
        left: 50%;
        transform: translateX(-50%);
        border-width: 20px 20px 0;
        border-style: solid;
        border-color: var(--border-color) transparent transparent;
        display: block;
        width: 0;
    }
    .comic-bubble::before {
        content: '';
        position: absolute;
        bottom: -14px;
        left: 50%;
        transform: translateX(-50%);
        border-width: 14px 14px 0;
        border-style: solid;
        border-color: #fff transparent transparent;
        display: block;
        width: 0;
        z-index: 1;
    }

    .bubble-text {
        font-size: 36px;
        color: var(--text-color);
        transform: rotate(-5deg);
        display: block;
    }

    @keyframes pop-bubble {
        0% { transform: translate(-50%, -50%) scale(0) rotate(-20deg); }
        60% { transform: translate(-50%, -50%) scale(1.2) rotate(5deg); }
        100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
    }

    .comic-bubble.active {
        animation: pop-bubble 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    /* --- 纸屑 --- */
    .confetti {
        position: absolute;
        width: 12px;
        height: 12px;
        background: var(--text-color);
        border: 2px solid var(--border-color);
        z-index: 90;
    }

</style>
</head>
<body>

<div class="speed-lines" id="speedLines"></div>

<div class="login-box" id="loginBox">
    <h1>WordPoP</h1>
    <!-- 这里的 id 很重要 -->
    <form id="loginForm">
        <input type="text" name="username" placeholder="输入学号 / 用户名" required>
        <button type="submit" id="loginBtn">开始学习</button>
    </form>
</div>

<script>
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const loginBox = document.getElementById('loginBox');
    const speedLines = document.getElementById('speedLines');

    // 监听表单提交事件
    loginForm.addEventListener('submit', function(e) {
        // 1. 阻止默认的提交行为（防止页面立刻刷新）
        e.preventDefault();

        // 2. 改变按钮状态，模拟“登录中”
        const originalText = loginBtn.innerText;
        loginBtn.innerText = '登录中...';
        loginBtn.style.opacity = '0.7';
        loginBtn.disabled = true; // 禁用按钮防止重复点击

        // 3. 模拟网络请求（假设需要 1 秒钟验证）
        // 在实际项目中，这里应该是你的 AJAX/Fetch 请求
        setTimeout(() => {
            // 假设这里是服务器返回了 "登录成功"
            // 只有在这里，我们才触发动画
            triggerSuccessAnimation();

            // 4. 动画播放完后，真正跳转到学习页面
            setTimeout(() => {
                // window.location.href = '/study'; // 这里写你的跳转链接
                loginBtn.innerText = '跳转中...';
            }, 1500);

        }, 1000); // 1000毫秒 = 1秒
    });

    // 专门负责动画的函数
    function triggerSuccessAnimation() {
        // A. 震动卡片
        loginBox.classList.add('shake-hard');

        // B. 显示背景集中线
        speedLines.style.opacity = '1';
        speedLines.style.transition = 'opacity 0.2s';

        // C. 创建漫画气泡
        const bubble = document.createElement('div');
        bubble.className = 'comic-bubble';
        bubble.innerHTML = '<span class="bubble-text">走你！</span>';
        document.body.appendChild(bubble);

        // 强制重绘以触发动画
        void bubble.offsetWidth; 
        bubble.classList.add('active');

        // D. 撒花特效
        createConfetti();

        // E. 清理动画类
        setTimeout(() => {
            loginBox.classList.remove('shake-hard');
        }, 500);
    }

    function createConfetti() {
        const colors = ['#D1D067', '#0D21A5', '#FF6B9D', '#fff'];
        const rect = loginBox.getBoundingClientRect();
        
        for(let i=0; i<30; i++) {
            const conf = document.createElement('div');
            conf.className = 'confetti';
            conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            
            conf.style.left = (rect.left + rect.width/2 + (Math.random() * 100 - 50)) + 'px';
            conf.style.top = (rect.top + rect.height/2 + (Math.random() * 100 - 50)) + 'px';
            
            conf.style.transform = `rotate(${Math.random() * 360}deg)`;
            document.body.appendChild(conf);

            const angle = Math.random() * Math.PI * 2;
            const velocity = Math.random() * 150 + 50;
            const tx = Math.cos(angle) * velocity;
            const ty = Math.sin(angle) * velocity;

            conf.animate([
                { transform: `translate(0,0) rotate(0deg)`, opacity: 1 },
                { transform: `translate(${tx}px, ${ty}px) rotate(360deg)`, opacity: 0 }
            ], {
                duration: 800,
                easing: 'ease-out'
            }).onfinish = () => conf.remove();
        }
    }
</script>

</body>
</html>
