<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WordPoP 单词大冒险</title>
<link href="https://fonts.loli.net/css2?family=Fredoka+One&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
/* ... 原有 CSS 全部保留 ... */
</style>
</head>
<body>
<!-- ... 原有 HTML 结构全部保留 ... -->
<script>
let currentGroup = [];
let index = 0;
const groupSize = 30;

// 发音
function speak(lang) {
  const text = document.getElementById('word').textContent;
  if (!text) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang; u.rate = 0.9;
  setTimeout(() => { window.speechSynthesis.speak(u); }, 50);
  const tip = document.getElementById('voiceTip');
  tip.textContent = lang === 'en-GB' ? '🇬🇧 英音' : '🇺🇸 美音';
  tip.classList.add('show');
  setTimeout(() => tip.classList.remove('show'), 1200);
}

// 拖动发音
const speakBtn = document.getElementById('speakBtn');
let startY = 0;
speakBtn.addEventListener('mousedown', e => { startY = e.clientY; speakBtn.style.transition = 'none'; e.preventDefault(); });
document.addEventListener('mousemove', e => { if (!startY) return; let dy = Math.max(-80, Math.min(80, e.clientY - startY)); speakBtn.style.transform = `translateY(-50%) translateY(${dy}px)`; });
document.addEventListener('mouseup', e => { if (!startY) return; const dy = e.clientY - startY; startY = 0; speakBtn.style.transition = 'transform 0.3s ease'; speakBtn.style.transform = 'translateY(-50%)'; if (dy < -30) speak('en-GB'); if (dy > 30) speak('en-US'); });
speakBtn.addEventListener('touchstart', e => { startY = e.changedTouches[0].clientY; speakBtn.style.transition = 'none'; });
document.addEventListener('touchmove', e => { if (!startY) return; let dy = Math.max(-80, Math.min(80, e.changedTouches[0].clientY - startY)); speakBtn.style.transform = `translateY(-50%) translateY(${dy}px)`; e.preventDefault(); });
speakBtn.addEventListener('touchend', e => { if (!startY) return; const dy = e.changedTouches[0].clientY - startY; startY = 0; speakBtn.style.transition = 'transform 0.3s ease'; speakBtn.style.transform = 'translateY(-50%)'; if (dy < -30) speak('en-GB'); if (dy > 30) speak('en-US'); });

// 左右滑动切词
let startX = 0;
document.addEventListener('mousedown', e => { startX = e.clientX; });
document.addEventListener('mouseup', e => { if (Math.abs(e.clientX - startX) > 100) e.clientX < startX ? nextWord() : prevWord(); });
document.addEventListener('touchstart', e => { startX = e.changedTouches[0].clientX; });
document.addEventListener('touchend', e => { if (Math.abs(e.changedTouches[0].clientX - startX) > 100) e.changedTouches[0].clientX < startX ? nextWord() : prevWord(); });

function updateCount() {
  const left = currentGroup.length - index;
  document.getElementById('count').textContent = `剩余：${left}`;
}

function showWord() {
  if (!currentGroup.length || index >= currentGroup.length) {
    document.getElementById('modal').classList.add('show');
    return;
  }
  const w = currentGroup[index];
  document.getElementById('word').textContent = w.单词 || '';
  document.getElementById('phonetic').textContent = w.音标 || '';
  document.getElementById('meaning').textContent = w.释义 || '';
  document.querySelector('.word-content').style.display = 'flex';
  document.querySelector('.meaning-content').style.display = 'none';
  cardBox.classList.remove('flipped');
  const sb = document.getElementById('starBtn');
  if (getStarred().includes(w.单词)) sb.classList.add('active');
  else sb.classList.remove('active');
}

function nextWord() {
  index++;
  updateCount();
  if (index >= currentGroup.length) {
    markLearned(currentGroup.map(w => w.单词));
    document.getElementById('modal').classList.add('show');
    checkAndPromptLogin();
    return;
  }
  showWord();
}

function prevWord() {
  if (index > 0) { index--; showWord(); }
}

// 收藏
function getStarred() { return JSON.parse(localStorage.getItem('starred_list') || '[]'); }
function setStarred(list) { localStorage.setItem('starred_list', JSON.stringify(list)); }
document.getElementById('starBtn').onclick = async function() {
  const word = currentGroup[index]?.单词;
  if (!word) return;
  const data = await fetch('/api/toggle-star', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({word})
  }).then(r=>r.json());
  let s = getStarred();
  if (data.action === 'added') s.push(word);
  else s = s.filter(w => w !== word);
  setStarred(s);
  document.getElementById('starBtn').classList.toggle('active', data.action === 'added');
};

// 跳过按钮（修复剩余未变的问题）
document.getElementById('skipBtn').onclick = () => {
  if (currentGroup.length && index < currentGroup.length - 1) {
    index++;
    updateCount();
    showWord();
  }
};

// 卡片翻转
document.getElementById('cardBox').addEventListener('click', () => {
  const cb = document.getElementById('cardBox');
  const front = document.querySelector('.word-content');
  const back = document.querySelector('.meaning-content');
  cb.classList.toggle('flipped');
  if (cb.classList.contains('flipped')) {
    document.getElementById('voiceTip').classList.remove('show');
    front.style.display = 'none'; back.style.display = 'flex';
  } else {
    front.style.display = 'flex'; back.style.display = 'none';
  }
});

// 标记已学
async function markLearned(words) { ... }  // 同上保持不变

// 登录提示
async function checkAndPromptLogin() { ... }

// 加载学习单词
async function initStudy() {
  const data = await fetch('/api/study-words').then(r=>r.json());
  currentGroup = data;
  index = 0;
  updateCount();
  showWord();
  const starred = await fetch('/api/word-list/starred').then(r=>r.json());
  setStarred(starred);
}

// 登录提示按钮
document.getElementById('laterLoginBtn').onclick = () => document.getElementById('loginPromptModal').classList.remove('show');
document.getElementById('goLoginBtn').onclick = () => window.location.href = '/login';
document.getElementById('continueBtn').onclick = () => { document.getElementById('modal').classList.remove('show'); initStudy(); };
document.getElementById('writeBtn').onclick = () => { window.location.href = '/writing'; };

initStudy();
</script>
</body>
</html>
