<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>默写本</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root {
  --bg-color: #B9C7F8;
  --card-color: #D1D067;
  --text-color: #0D2A5A;
  --accent-pink: #FF6B9D;
  --accent-cyan: #00D2BE;
  --border-color: #2D3436;
  --star-gold: #FFD700;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family: 'ZCOOL KuaiLe', cursive;
  background: var(--bg-color);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  user-select: none;
}
.container {
  width: 100%;
  max-width: 900px;
  height: 100%;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
  padding: 20px;
}
.header {
  position: absolute;
  top: 40px;
  width: 90%;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.title {
  font-size: 36px;
  color: var(--text-color);
  transform: rotate(-2deg);
  text-shadow: 2px 2px 0 #fff;
}
.back-btn {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--accent-pink);
  color: #fff;
  border: 3px solid var(--border-color);
  font-size: 22px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.upload-btn {
  position: absolute;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--accent-cyan);
  color: #fff;
  border: 3px solid var(--border-color);
  font-size: 28px;         
  cursor: pointer;
  display: none;
  z-index: 10;
  align-items: center;
  justify-content: center;
  line-height: 1;
}
.card {
  width: 100%;
  max-width: 480px;
  padding: 28px 20px;
  background: var(--card-color);
  border: 4px solid var(--border-color);
  border-radius: 22px;
  box-shadow: 6px 6px 0 var(--border-color);
  text-align: center;
  cursor: pointer;
}
.card h2 { font-size: 26px; color: var(--text-color); }
.list-container {
  width: 100%;
  max-width: 480px;
  height: 70vh;
  overflow-y: auto;
  background: rgba(255,255,255,0.4);
  border: 3px solid var(--border-color);
  border-radius: 16px;
  padding: 16px;
  display: none;
}
.word-item {
  padding: 12px 16px;
  background: #fff;
  border-radius: 10px;
  margin-bottom: 10px;
  font-size: 20px;
  color: #222;
  border: 2px solid var(--border-color);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.star {
  font-size: 22px;
  color: var(--star-gold);
  cursor: pointer;
  transition: all 0.2s;
}
.star.active { color: var(--accent-pink); transform: scale(1.2); }
.start-btn {
  padding: 14px 36px;
  background: var(--accent-cyan);
  border: 3px solid var(--border-color);
  border-radius: 16px;
  font-size: 22px;
  color: var(--text-color);
  cursor: pointer;
  display: none;
}
/* 轮默次数选择 */
.round-selector {
  display: none;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
  font-size: 20px;
}
.round-selector select {
  font-size: 20px;
  padding: 5px 10px;
  border-radius: 8px;
  border: 2px solid var(--border-color);
  font-family: 'ZCOOL KuaiLe', cursive;
}
/* 手动添加区域 */
.manual-add {
  display: none;
  gap: 10px;
  justify-content: center;
  margin-top: 10px;
}
.manual-add input {
  font-size: 20px;
  padding: 8px;
  border-radius: 8px;
  border: 2px solid var(--border-color);
  width: 180px;
  font-family: 'Fredoka One', cursive;
}
.manual-add button {
  font-size: 20px;
  padding: 8px 16px;
  border-radius: 8px;
  border: 2px solid var(--border-color);
  background: var(--accent-cyan);
  color: var(--text-color);
  cursor: pointer;
  font-family: 'ZCOOL KuaiLe', cursive;
}
#fileInput { display: none; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title">默写本</div>
    <button class="back-btn" id="backBtn" onclick="goBack()">✕</button>
  </div>

  <button class="upload-btn" id="uploadBtn" style="top: 40px; right: 20px;">＋</button>
  <button class="upload-btn" id="cameraBtn" style="top: 90px; right: 20px;">📸</button>

  <div id="cameraModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:1000; flex-direction:column; align-items:center; justify-content:center;">
    <video id="cameraVideo" autoplay playsinline style="width:100%; max-width:500px; border-radius:16px;"></video>
    <canvas id="cameraCanvas" style="display:none;"></canvas>
    <div style="margin-top:20px; display:flex; gap:20px;">
      <button id="captureBtn" style="padding:14px 28px; background:var(--accent-cyan); border:3px solid var(--border-color); border-radius:16px; font-size:20px; color:var(--text-color);">拍照</button>
      <button id="closeCameraBtn" style="padding:14px 28px; background:var(--accent-pink); border:3px solid var(--border-color); border-radius:16px; font-size:20px; color:#fff;">关闭</button>
    </div>
  </div>

  <div class="card" onclick="showList('starred')"><h2>我的收藏</h2></div>
  <div class="card" onclick="showList('learned')"><h2>已学单词</h2></div>
  <div class="card" onclick="showList('selfstudy')"><h2>默写自习室</h2></div>

  <div class="list-container" id="listBox"></div>
  
  <div class="manual-add" id="manualAddBox">
    <input type="text" id="manualAddInput" placeholder="添加英文单词">
    <button id="manualAddBtn">添加</button>
  </div>
  
  <div class="round-selector" id="roundSelectorBox">
    轮默次数：
    <select id="roundsSelect">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3" selected>3</option>
      <option value="4">4</option>
      <option value="5">5</option>
    </select>
  </div>

  <button class="start-btn" id="startBtn">开始默写</button>
</div>

<input type="file" id="fileInput" accept="image/*">

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@2/dist/tesseract.min.js"></script>
<script>
const WORD_MAP = JSON.parse(localStorage.getItem('all_words_json') || '[]').reduce((m, v) => {
  m[v.单词] = v.释义;
  return m;
}, {});

function get(key) {
  try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) { return []; }
}
function set(key, data) {
  localStorage.setItem(key, JSON.stringify(data));
}

let currentType = '';
let currentView = 'cards';   // 'cards' 或 'list'

function showCards() {

  document.querySelectorAll('.card').forEach(c => c.style.display = 'block');
  document.getElementById('listBox').style.display = 'none';
  document.getElementById('startBtn').style.display = 'none';
  document.getElementById('roundSelectorBox').style.display = 'none';
  document.getElementById('manualAddBox').style.display = 'none';
  document.getElementById('uploadBtn').style.display = 'none';
  document.getElementById('cameraBtn').style.display = 'none';
  
  currentView = 'cards';
  // 退出按钮行为：返回index主页
  document.getElementById('backBtn').onclick = () => {
    window.location.href = '/';
  };
}

// 显示某一类型的单词列表
function showList(type) {
  currentType = type;
  let list = get('wordpop_' + type);

  // 隐藏卡片
  document.querySelectorAll('.card').forEach(c => c.style.display = 'none');
  // 显示列表、开始按钮、轮默选择
  document.getElementById('listBox').style.display = 'block';
  document.getElementById('startBtn').style.display = 'block';
  document.getElementById('roundSelectorBox').style.display = 'flex';
  
  // 自习室独有的：手动添加、上传/拍照按钮
  document.getElementById('manualAddBox').style.display = (type === 'selfstudy') ? 'flex' : 'none';
  document.getElementById('uploadBtn').style.display = (type === 'selfstudy') ? 'flex' : 'none';
  document.getElementById('cameraBtn').style.display = (type === 'selfstudy') ? 'flex' : 'none';

  document.getElementById('listBox').innerHTML = list.map(w => `
    <div class="word-item">
      <span>${w}</span>
      ${type === 'starred' ? `<div class="star" onclick="unstar(this,'${w}')">★</div>` : ''}
    </div>
  `).join('');

  currentView = 'list';

  document.getElementById('backBtn').onclick = () => {
    showCards();
  };
}

function goBack() {
  if (currentView === 'list') {
    showCards();
  } else {
    window.location.href = '/';
  }
}

function unstar(el, word) {
  el.classList.add('active');
  setTimeout(() => {
    let arr = get('wordpop_starred');
    set('wordpop_starred', arr.filter(x => x !== word));
    showList('starred');
  }, 200);
}

function extractEnglish(text) {
  return (text.match(/[a-zA-Z]{2,}/g) || []).map(w => w.toLowerCase());
}

function isValidWord(word) {
  return /^[a-zA-Z]{2,20}$/.test(word);
}

// 图片压缩
function compressImage(fileOrBlob, maxSize) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        if (width > maxSize || height > maxSize) {
          if (width > height) { height *= maxSize / width; width = maxSize; }
          else { width *= maxSize / height; height = maxSize; }
        }
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        canvas.toBlob(resolve, 'image/jpeg', 0.8);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(fileOrBlob);
  });
}

async function processImage(fileOrBlob) {
  const loading = document.createElement('div');
  loading.innerText = '正在识别单词...';
  loading.style.cssText = `
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    background:#000;color:#fff;padding:12px 24px;border-radius:8px;z-index:999;
  `;
  document.body.appendChild(loading);
  try {
    const compressedBlob = await compressImage(fileOrBlob, 1200);
    const worker = await Tesseract.createWorker('eng', 1, {
      logger: m => {
        if (m.status === 'recognizing text') loading.innerText = `识别中 ${Math.round(m.progress * 100)}%`;
      }
    });
    const { data: { text } } = await worker.recognize(compressedBlob, {
      tessedit_pageseg_mode: '6',
      tessedit_char_whitelist: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ',
    });
    await worker.terminate();

    const rawWords = extractEnglish(text);
    const validWords = [];
    for (const w of rawWords) {
      if (isValidWord(w)) {
        validWords.push(w);
      }
    }

    const old = get('wordpop_selfstudy');
    const combined = [...new Set([...old, ...validWords])];
    set('wordpop_selfstudy', combined);

    showList('selfstudy');
  } catch (err) {
    console.error(err);
    alert('识别失败，请换一张更清晰的图片或重试');
  } finally {
    document.body.removeChild(loading);
  }
}

document.getElementById('fileInput').onchange = function (e) {
  const file = e.target.files[0];
  if (!file) return;
  this.value = '';
  processImage(file);
};

// 拍照功能
const cameraBtn = document.getElementById('cameraBtn');
const cameraModal = document.getElementById('cameraModal');
const cameraVideo = document.getElementById('cameraVideo');
const cameraCanvas = document.getElementById('cameraCanvas');
const captureBtn = document.getElementById('captureBtn');
const closeCameraBtn = document.getElementById('closeCameraBtn');
let mediaStream = null;

async function openCamera() {
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' },
      audio: false
    });
    cameraVideo.srcObject = mediaStream;
    cameraModal.style.display = 'flex';
  } catch (err) {
    alert('无法打开摄像头，请检查权限或使用上传图片功能。');
    console.error(err);
  }
}
function closeCamera() {
  if (mediaStream) {
    mediaStream.getTracks().forEach(t => t.stop());
    mediaStream = null;
  }
  cameraVideo.srcObject = null;
  cameraModal.style.display = 'none';
}
cameraBtn.onclick = openCamera;
closeCameraBtn.onclick = closeCamera;
captureBtn.onclick = () => {
  const ctx = cameraCanvas.getContext('2d');
  cameraCanvas.width = cameraVideo.videoWidth;
  cameraCanvas.height = cameraVideo.videoHeight;
  ctx.drawImage(cameraVideo, 0, 0, cameraCanvas.width, cameraCanvas.height);
  cameraCanvas.toBlob(blob => {
    closeCamera();
    processImage(blob);
  }, 'image/jpeg', 0.8);
};

// 手动添加单词
document.getElementById('manualAddBtn').onclick = function() {
  const input = document.getElementById('manualAddInput');
  const word = input.value.trim();
  if (!isValidWord(word)) {
    alert('请输入默写单词');
    return;
  }
  const old = get('wordpop_selfstudy');
  if (old.includes(word.toLowerCase())) {
    alert('单词已存在');
    return;
  }
  old.push(word.toLowerCase());
  set('wordpop_selfstudy', old);
  showList('selfstudy');
  input.value = '';
};

document.getElementById('startBtn').onclick = function () {
  const rounds = parseInt(document.getElementById('roundsSelect').value, 10);
  localStorage.setItem('practice_required_correct', rounds);
  localStorage.setItem('current_practice', currentType);
  window.location.href = '/writing/practice';
};

showCards();
</script>
</body>
</html>
